<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Filter</title>
	<style type="text/css">
		img{
						 filter:sepia(10%); 
			 /* If we want to give a multiple values then write 
			filter: blur(15px) hue-rotate(160deg) saturate(300%); */
		}
	</style>
</head>
<body>
	<h1>SevenMentor</h1>
	<img src="media/nature.jpg" width="300px" height="300px" style="margin-left: 50%;">
	<!--It has 12 values
		none
		
		blur()--gives value in px. default value is 0.
		
		brightness()--Gives value in percantage.deafault value is 100%. If u give zero value it turns black
		
		contrast()--100% is deafault value. if u give grater than 100 its gives a contraxt color. 
		
		drop-shadow()--(horizantal , vertical, blur)--same as box shadow. we give a minus value also
		
		grayscale()--It is used for black and white picture.zero is deafault value.in 100% it gives a black and white image.
		
		hue-rotate()- It worked as a color picker.Here we gives a value in 0-360 deg.negative values is not allowed.
		
		invert() - look like lights effect. Here we give value inbetween 0-100%. Zero is default value.Negative values are not allowed.
		
		opacity() --image transfer ..gives a value in %;
		 
		 saturate()-- colors saturate. deafault value is 100%. If we increase the value its saturate and if we decrease the value it is unsaturate.
		
		sepia() -- Here we give a value in 0-100%.Negative values are not allowed.
		
		url()-It is used with svg-->

</body>
</html>
