<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div{
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            animation-name: abc;
            animation-duration: 4s;
            animation-delay: 3s;
            animation-iteration-count: infinite;
            animation-direction: reverse;
            animation-timing-function: ease;
        }

        @keyframes abc {
            0%{
                left: 0px;border-radius: 10%;
            }
            25%{
                left: 400px;border-radius: 20%; border: 1px solid black;
            }
            50%{
                left: 600px;border-radius: 30%;
            }
            75%{
                left: 800px;border-radius: 50%;
            }
            100%{
                left: 0px;border-radius: 0px;border: 1px solid black;
            }
        }

    </style>
</head>
<body>
    <div class="div"></div>
</body>
</html>
