<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*input:checked{
            width: 30px;

        }*/
        input:default{
            width: 40px;
            height: 40px;
        }
        .input:disabled{
            background-color: red;
        }
        .num:in-range{
            border: 2px solid red;
        }
        .num1:invalid{
            border: 4px solid rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <form>
        <input type="checkbox" checked/>List 1
        <input type="checkbox"/>List 2
        <input type="checkbox"/>List 3
        <input type="checkbox"/>List 4
        <input type="checkbox"/>List 5

        <br><br><br><br>
        <input type="radio" class="abc" checked>Yes
        <input type="radio" class="abc">No
        <input type="radio" class="abc">Nothing to say
        <input type="radio" class="abc">Decline
        
        <br><br><br><br>
        <input type="text" placeholder="Enter your name">
        <input type="text" placeholder="Enter your name" class="input" disabled="disabled">

        <br><br><br><br>
        <input type="number" min="0" max="10" value="7" class="num">
        
        <br><br><br><br>
        <input type="email" class="num1" value="email">
    </form>
</body>
</html>
