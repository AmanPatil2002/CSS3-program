<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Align Grid Items</title>
	<style type="text/css">
	h1{
		padding: 0  0 0 40px;
	}
		.container{
			background: #eee;
			width: 700px;
			height: 700px;
			margin: 45px auto 0;

			display: grid;
			grid-template-columns: repeat(2, 300px);
			grid-template-rows: repeat(2, 200px);
			grid-gap: 15px;

			grid-auto-rows: 50px;
			/*grid-auto-flow: row dense;/column dense; - It fill the empty cells.*/

			/*Justify content is used for Horizantal alignment. It has some values
			start,end,center,stretch(default) space-around,space-between, space-evenly*/

			justify-content: center;

			/*align-content it is used for Vertical alignment. Values are same
			start, end,center,stretch, space-around, space-between, space-evenly*/

			align-content: space-around;
			
		}
		.item1{
			background: red;
		}
		.item2{
			background: green;
		}
		.item3{
			background: yellow;
			grid-row: span 3;
		}
		.item4{
			background: lightblue;
		}
		.item5{
			background: cyan;
		}
		.item6{
			background: magenta;
			grid-column: span 2;
		}
		.item7{
			background: orange;
			
		}
		.item8{
			background: gold;
			
		}
		</style>
</head>
<body>
	
        <div class="container">
	<div class="item1">one</div>
	<div class="item2">two</div>
	<div class="item3">Three</div>
	<div class="item4">Four</div>
	<div class="item5">Five</div>
	<div class="item6">Six</div>
	<div class="item7">Seven</div>
	<div class="item8">Eight</div>
	


	</div>

</body>
</html>
