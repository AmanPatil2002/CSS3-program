<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img2{
            image-rendering: optimizeSpeed;
        }
        .img3{
            image-rendering: crisp-edges;
        }
        .img4{
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <img src="image/gojo.jpeg" width="300px" height="300px"/>
    <img src="image/gojo.jpeg" width="300px" height="300px" class="img2"/>
    <img src="image/gojo.jpeg" width="300px" height="300px" class="img3"/>
    <img src="image/gojo.jpeg" width="300px" height="300px" class="img4"/>
</body>
</html>
