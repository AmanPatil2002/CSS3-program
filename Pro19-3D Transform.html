<!DOCTYPE html>
 
<html>
     
    <head>
 
        <title>Title Name will go here</title>
 
        <style>
 
            #div_norotate
            {
                float:left;
                margin:50px 0 0 50px;               
                width:100px;
                height:100px;
                background-color:rgba(255,0,0,0.5);
                border:1px solid #000000;
                opacity:0.4;
                filter:alpha(opacity=40);

            #div_rotateY
            {
                position:absolute;
                margin:50px 0 0 50px;               
                width:100px;
                height:100px;
                background-color:rgba(255,0,0,0.5);
                border:1px solid #000000;
          transform:matrix(0.4532, 0.4233, 0.5243,0.1232, 0.2341, -0.0234,0.4345, 0.56, 0.1234,0.34,0.45,0.32,0.123,0.0567,0.21,0);
                
            }
             
        </style>
     
    </head>
    <body>
 
        <div id="div_norotate"> original</div>
        <div id="div_rotateY">After rotateY method</div>        
         
    </body>
     
</html>
