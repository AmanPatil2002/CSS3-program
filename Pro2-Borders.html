<!DOCTYPE html>
 
<html>
     
    <head>
         <title>Title Name will go here</title>
    </head>
     
    <style>
        #border_radius
        {
            border:2px solid;
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
            padding: 10px;
            background: #6AAFCF;
            border-radius:25px;
        }
 
        #box_shadow
        {
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
            padding: 10px;
            background: #6AAFCF;
            
            box-shadow: 15px 15px 5px #888245;
        }
         
        #border_image
        {
		  margin-top:25px;
            border-width: 15px;
            border: 10px solid transparent;
            border-image-source: url(media/flower1.png);
            border-image-slice: 100;
            /*-borderimage:url(media/flower1.png) 30 30 round;*/
          /*  border-image-source:; <- Location of the image 
            border-image-slice: number/ length (100%) ;<- 9 section - 4border + 4corner + 1center
            border-image-outset: number /length; property specifies the amount by which the border image area extends beyond the border box.
            border-image-width: number ;
            border-image-repeat: stretch(default)/ round /repeat ;
            shorthand property: 
            border-image: border-image-source border-image-outset border-image-slice border-image-width border-image-repeat ;
            */
        }                
 
    </style>
     
    <body>
 
        <div id="border_radius">
            With the help of border-radius properties, we can make the rounded corners border.
        </div>
        <br><br><br>
         
        <div id="box_shadow">
            With the help of box-shadow properties, we can create the shadow for a box.
        </div>  
        <br><br><br>
        <div id="border_image">
            You can see the customized border. This could be either *.png or *.jpg format.
        </div>        
 
    </body>
     
</html>
