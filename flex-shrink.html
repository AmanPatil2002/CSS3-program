<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 200px;
            height: 300px;
            display: flex;
            align-items: flex-start;
            background-color: lightblue;
        }

        .div1{
            background-color: red;
            flex-basis: 100px;
            flex-shrink: 10;
        }
        .div2{
            background-color: blue;
            flex-basis: 100px;
            flex-shrink: 5;
        }
        .div3{
            background-color: greenyellow;
            flex-basis: 100px;
            flex-shrink: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="div1">Lorem ipsum dolor sit amet.</div>
        <div class="div2">Lorem ipsum dolor sit amet.</div>
        <div class="div3">Lorem ipsum dolor sit amet.</div>
    </div>
</body>
</html>
