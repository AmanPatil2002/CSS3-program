<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Animation-Fill-Mode</title>
	<style type="text/css">
	
		.box{
			width: 150px;
			height: 150px;
			background: black;
			margin-left: 20px;
			animation: abc 2s 5s;
			animation-fill-mode: forwards;/*forwords/both/deafault -none;*/
			/*second state : play state . It has a two value 1)pause 2)running*/
			animation-play-state: paused;


		}
		.box:hover{
			animation-play-state: running;
		}
		@keyframes abc{
			0%{background: yellow; width: 250px;}
			50%{background: green; width: 350px;}
            100%{background: red; width: 450px;}

		}
	</style>
</head>
<body>
<div class="box"></div>
</body>
</html>
