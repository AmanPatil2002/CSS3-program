<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
  body{
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 30px;

}
#heart{
    position: relative;
    width: 200px;
    height: 180px;
    /* background-color: red; */
    animation: hearts infinite 1s ease;
}
#heart::before,
#heart::after{
    content:'';
    position: absolute;
    left: 100px;
    top: 0;
    width: 100px;
    height: 160px;
    border-radius: 50px 50px 0px 0px;
    transform: rotate(-45deg);
    background-color: red;
  
    transform-origin: 0 100%;
   

}
#heart::after{
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
   

}

@keyframes hearts {
    0%{
        transform: scale(1);
    }
    50%{
        transform: scale(1.2);
    }
    100%{
        transform: scale(1);
    }
    
}


       
    </style>
</head>
<body>
    <div id="heart"></div>
</body>
</html>
