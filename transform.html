<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 30px;
            /* transform: rotate(45deg); */
            transition: transform,2s;
        }
        .div1:hover{
            transform: rotate(45deg);            
        }
        .div2{
            width: 100px;
            height: 100px;
            background-color: blue;
            margin: 30px;
            /* transform: rotate(45deg); */
            transition: transform,2s;
        }
        .div2:hover{
            transform: rotateX(60deg);            
        }
        .div3{
            width: 100px;
            height: 100px;
            background-color: greenyellow;
            margin: 30px;
            /* transform: rotate(45deg); */
            transition: transform,2s;
        }
        .div3:hover{
            transform: rotateY(-45deg);            
        }
        .div4{
            width: 100px;
            height: 100px;
            background-color: yellow;
            margin: 30px;
            /* transform: rotate(45deg); */
            transition: transform,2s;
        }
        .div4:hover{
            transform: rotateZ(120deg);            
        }
        .div5{
            width: 100px;
            height: 100px;
            background-color: purple;
            margin: 30px;
            /* transform: rotate(45deg); */
            transition: transform,2s;
        }
        .div5:hover{
            transform: rotate3d(1,1,0,120deg);            
        }

    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div4"></div>
    <div class="div5"></div>
</body>
</html>
