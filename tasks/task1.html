<html lang="en">
<head>

    <style>
        .div1,.div2,.div3,.di4{
            width: 300px;
            height: 300px;
            position: relative;
        }
        .overlay{
            position: absolute;
            width: 300px;
            overflow: hidden;
            background-color: black;
            background-color: rgba(14, 13, 13, 0.466);
            opacity: 0;
            bottom: 0x;
            right: 300px;
            left: 0;
            top: 0;
            transition: transform, 3s;
        }
        .content{
            text-align: center;
            width: 100%;
        }
        .content h2{
            margin-top: 36%;
            color: white;
        }
        .content button{
            outline: none;
            border: none;
            padding: 12px;

        }
        .content button:hover{
            background-color: red;
            color: white;
            cursor: pointer;
            box-shadow: 0px 0px 3px rgb(247, 236, 236);
        }
        .div1:hover .overlay{
            opacity: 1;
            transform: translate(-300px);
            height: 300px;
            bottom: 300px;
        }
