<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div{
            width: 500px;
            height: 500px;
            background-image: url(./image/gojo-satoru.gif);
            position: relative;
            animation-name: gojo;
            animation-duration: 4s;
            animation-delay: 3s;
            animation-iteration-count: infinite;
            animation-direction:reverse;
            animation-timing-function: ease;
        }

        @keyframes gojo {
            0%{
                left: 0px;
            }
            25%{
                left: 400px;
            }
            50%{
                left: 600px;
            }
            75%{
                left: 800px;
            }
            100%{
                left: 0px;
            }
        }

    </style>
</head>
<body>
    <div class="div"></div>
</body>
</html>
