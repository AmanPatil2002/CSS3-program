<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            background-color: red;
            width: 100px;
            height: 100px;
            margin: 40px;
            transition: transform, 2s;
        }
        .div1:hover{
            transform: skew(40deg);
        }
        .div2{
            background-color: blue;
            width: 100px;
            height: 100px;
            margin: 40px;
            transition: transform, 2s;
        }
        .div2:hover{
            transform: skewX(45deg);
        }
        .div3{
            background-color: green;
            width: 100px;
            height: 100px;
            margin: 40px;
            transition: transform, 2s;
        }
        .div3:hover{
            transform: skewY(-45deg);
        }
        .div4{
            background-color: yellow;
            width: 100px;
            height: 100px;
            margin: 40px;
            transition: transform, 2s;
        }
        .div4:hover{
            transform: skew(40deg);
        }
        
    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div4"></div>
    
</body>
</html>
