<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Implict & Explict</title>
	<style type="text/css">
	h1{
		padding: 0  0 0 40px;
	}
		.container{
			background: #eee;
			width: 650px;
			margin: 45px auto 0;

			display: grid;
			grid-template-columns: repeat(2, 1fr);
			grid-template-rows: repeat(2, 120px);
			grid-gap: 15px;

			grid-auto-rows: 80px;
			/*grid-auto-flow: column;/*row-deafault value;*/

			/*grid-auto-columns: .5fr;*/
		}
		.item1{
			background: red;
		}
		.item2{
			background: green;
		}
		.item3{
			background: yellow;
		}
		.item4{
			background: lightblue;
		}
		.item5{
			background: cyan;
		}
		.item6{
			background: magenta;
		}
		.item7{
			background: orange;
		}
		.item8{
			background: gold;
		}
	</style>
</head>
<body>
	<div class="container">
	<div class="item1">one</div>
	<div class="item2">two</div>
	<div class="item3">Three</div>
	<div class="item4">Four</div>
	<div class="item5">Five</div>
	<div class="item6">Six</div>
	<div class="item7">Seven</div>
	<div class="item8">Eight</div>
	<!--<div class="item8">Eight</div>
	<div class="item8">Eight</div>-->


	</div>

</body>
</html>
