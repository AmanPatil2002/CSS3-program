<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Page Loader</title>
	<style type="text/css">
		.loading{
			display: flex;
			justify-content: center;
		}

		.loading:after{
			content: "";
			width: 100px;
			height: 100px;
			border: 10px solid grey;
			border-top-color: green;
			border-bottom-color: green;
			border-radius: 50%;
			animation: loading 3s linear infinite;


		}
		@keyframes loading{
			to{
				transform: rotate(1turn);
			}
		}
	</style>
</head>
<body>
	<div class="loading loading--full-light"></div>



</body>
</html>
