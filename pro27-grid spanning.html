<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Grid Spanning html</title>
	<style type="text/css">
	.container{
			background: grey;
			width: 700px;
			margin: 70px 0 0 50px;
            display:grid;
			grid-template-columns:repeat(3,1fr);
			grid-template-rows: repeat(4, 1fr);
			grid-gap: 20px;

		}
		.items1{
			background: orangered;
			grid-row-start: 2;
			grid-row-end: 3;
			grid-column-start: 3;
			grid-column-end: 4;
			/*z-index: 1;*/
			/* grid-row:2/3;
			grid-column:3/4; ---shothand property */
			/*second shorthand property: grid-area: 2/3/3/4*/;
		}
		.items2{
			background: yellowgreen;
			grid-row: 2/span 3;
		}
		.items3{
			background: slateblue;
		}
		.items4{
			background: hotpink;
			grid-column: 2/4;/*overlapping */
			grid-row: 1/3;
		}
		.items5{
			background: royalblue;
		}
		.items6{
			background: goldenred;
			grid-row-start: 1;
			grid-row-end: 2;
			grid-column-start: 1;
			grid-column-end: 2;
		}
		
	</style>
</head>
<body>
	<div class="container">
	<div class="items1">First</div>
	<div class="items2">Second</div>

	<div class="items3">Third</div>

	<div class="items4">Fourth</div>

	<div class="items5">Fifth</div>

	<div class="items6">Sixth</div>
	</div>

</body>
</html>
