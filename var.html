<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --blue:rgb(0,0,255);
            --pink:#FFC0C8;
            --font-size:10px;
            --margin:auto;
        }
        .div{
            width: 400px;
            height: 300px;
            border: 1px solid black;
            background-color: var(--blue);
            margin: var(--margin);
        }
        .div1{
            background-color: var(--pink);
            font-size: var(--font-size);
        }
    </style>
</head>
<body>
    <div class="div">
        <div class="div1">
            <h2>Hello everyone</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Vel, vitae, eum sint excepturi enim quibusdam facere iste cum recusandae molestiae nulla consequuntur! Est voluptatem dolorem et illum ex quidem recusandae.</p>
        </div>
    </div>
    <div class="div2">
        This is div2<br><br><br><br>
        <a href="#div1">Go to the 1st Div</a>
    </div>
</body>
</html>
